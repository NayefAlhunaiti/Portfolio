<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sam Copilot</title>
  <style>
    :root {
      --page-bg: #e0f2fe;
      --window: #ffffff;
      --window-soft: #f0f9ff;
      --sky: #38bdf8;
      --sky-strong: #0284c7;
      --sky-deep: #075985;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #bae6fd;
      --danger: #b91c1c;
      --shadow: 0 24px 70px rgba(3, 105, 161, 0.26);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 12%, rgba(56, 189, 248, 0.35), transparent 34%),
        linear-gradient(135deg, #e0f2fe 0%, #f8fafc 100%);
    }

    .widget-shell {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: min(420px, calc(100vw - 32px));
      height: min(720px, calc(100vh - 48px));
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--window);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .widget-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: linear-gradient(135deg, var(--sky) 0%, #7dd3fc 100%);
      color: #fff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.36);
    }

    .logo-wrap {
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.74);
      color: var(--sky-deep);
      font-weight: 800;
      letter-spacing: 0;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 5px;
    }

    .brand {
      min-width: 0;
      flex: 1;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.08rem;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .brand p {
      margin: 3px 0 0;
      color: rgba(255, 255, 255, 0.88);
      font-size: 0.84rem;
      line-height: 1.3;
    }

    .demo-badge {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      margin-top: 6px;
      padding: 3px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.24);
      color: #fff;
      font-size: 0.74rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button, select, textarea {
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    button {
      cursor: pointer;
      font-weight: 700;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.42);
    }

    .controls {
      padding: 12px 14px;
      background: var(--window-soft);
      border-bottom: 1px solid var(--line);
    }

    details summary {
      cursor: pointer;
      color: var(--sky-deep);
      font-weight: 700;
      font-size: 0.9rem;
      list-style-position: inside;
    }

    .controls-grid {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    select, textarea {
      width: 100%;
      padding: 10px 11px;
      background: #fff;
      color: var(--ink);
    }

    textarea {
      min-height: 78px;
      resize: vertical;
    }

    .check-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      color: var(--ink);
      font-size: 0.88rem;
    }

    .check-label input {
      width: auto;
      margin: 0;
    }

    .row-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .secondary {
      width: 100%;
      padding: 9px 10px;
      background: #e0f2fe;
      color: var(--sky-deep);
      border-color: #bae6fd;
    }

    .status-line {
      margin: 0;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .error {
      color: var(--danger);
    }

    .messages {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      overflow-y: auto;
      background:
        linear-gradient(180deg, rgba(240, 249, 255, 0.72), rgba(255, 255, 255, 0.98));
    }

    .bubble {
      max-width: 88%;
      padding: 11px 12px;
      border-radius: 8px;
      white-space: pre-wrap;
      line-height: 1.48;
      font-size: 0.92rem;
      border: 1px solid var(--line);
      overflow-wrap: anywhere;
    }

    .bubble.user {
      align-self: flex-end;
      color: #fff;
      background: var(--sky-strong);
      border-color: var(--sky-strong);
    }

    .bubble.assistant {
      align-self: flex-start;
      background: #ffffff;
      border-color: #bae6fd;
    }

    .bubble.meta {
      align-self: center;
      max-width: 96%;
      color: var(--muted);
      background: #f8fafc;
      font-size: 0.82rem;
    }

    .composer {
      padding: 12px;
      background: var(--window);
      border-top: 1px solid var(--line);
    }

    .composer textarea {
      min-height: 76px;
      max-height: 150px;
    }

    .send-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .primary {
      flex: 1;
      padding: 11px 14px;
      color: #fff;
      background: var(--sky-strong);
      border-color: var(--sky-strong);
    }

    .primary:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    code {
      padding: 1px 4px;
      border-radius: 5px;
      background: #e0f2fe;
      color: var(--sky-deep);
    }

    .is-minimized {
      height: auto;
    }

    .is-minimized .controls,
    .is-minimized .messages,
    .is-minimized .composer {
      display: none;
    }

    @media (max-width: 560px) {
      .widget-shell {
        right: 10px;
        bottom: 10px;
        width: calc(100vw - 20px);
        height: calc(100vh - 20px);
      }
    }
  </style>
</head>
<body>
  <main class="widget-shell" id="widgetShell" aria-label="Sam Copilot chat window">
    <header class="widget-header">
      <div class="logo-wrap" aria-label="Company logo">
        <img id="companyLogo" src="/assets/company-logo.webp" alt="Company logo" />
        <span id="logoFallback">SAM</span>
      </div>
      <div class="brand">
        <h1>Sam Copilot</h1>
        <p>Enterprise assistant for HR, IT, SAP, and Ariba help.</p>
        <span class="demo-badge">__DEMO_PROFILE__</span>
      </div>
      <div class="header-actions">
        <button id="minimizeBtn" class="icon-btn" type="button" title="Minimize chat" aria-label="Minimize chat">-</button>
      </div>
    </header>

    <section class="controls">
      <details>
        <summary>Chat settings</summary>
        <div class="controls-grid">
          <div>
            <label for="role">Role</label>
            <select id="role">
              <option value="buyer">Buyer</option>
              <option value="procurement_manager">Procurement Manager</option>
              <option value="sourcing_specialist">Sourcing Specialist</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div>
            <label for="context">Context</label>
            <textarea id="context" placeholder="Add HR, IT, SAP, Ariba, ticket, or policy context here."></textarea>
          </div>
          <div>
            <label for="responseStyle">Response style</label>
            <select id="responseStyle">
              <option value="human" selected>Human-friendly</option>
              <option value="action">Action-oriented</option>
              <option value="structured">Structured JSON</option>
            </select>
          </div>
          <div>
            <label for="modelSelect">Ollama model</label>
            <select id="modelSelect">
              <option value="llama3.2:1b" selected>1B prototype - llama3.2:1b</option>
              <option value="llama3.1:8b">8B stronger answers - llama3.1:8b</option>
            </select>
          </div>
          <label class="check-label">
            <input id="autoImplement" type="checkbox" />
            Auto-implement request details
          </label>
          <p class="status-line">Selected model: <code id="selectedModelText">__OLLAMA_MODEL__</code></p>
          <p class="status-line">Demo note: __DEMO_RUNTIME_NOTE__.</p>
          <div class="row-actions">
            <button id="newSessionBtn" class="secondary" type="button">New Session</button>
            <button id="clearBtn" class="secondary" type="button">Clear Chat</button>
          </div>
          <button id="copySessionBtn" class="secondary" type="button">Copy Session ID</button>
          <p class="status-line">Session ID: <code id="sessionIdText"></code></p>
          <p class="status-line">Status: <span id="statusText">Ready</span></p>
          <p class="status-line error" id="errorText"></p>
        </div>
      </details>
    </section>

    <section class="messages" id="messages" aria-live="polite"></section>

    <section class="composer">
      <form id="chatForm">
        <label for="message">Message</label>
        <textarea id="message" placeholder="Ask about password reset, annual leave, SAP T-codes, Ariba workflows, or approvals." required></textarea>
        <div class="send-row">
          <button id="sendBtn" class="primary" type="submit">Send</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    const SESSION_KEY = "sam_copilot_session_id";
    const HISTORY_KEY = "sam_copilot_chat_history_v1";

    const widgetShell = document.getElementById("widgetShell");
    const messagesEl = document.getElementById("messages");
    const roleEl = document.getElementById("role");
    const contextEl = document.getElementById("context");
    const responseStyleEl = document.getElementById("responseStyle");
    const modelSelectEl = document.getElementById("modelSelect");
    const autoImplementEl = document.getElementById("autoImplement");
    const messageEl = document.getElementById("message");
    const statusEl = document.getElementById("statusText");
    const errorEl = document.getElementById("errorText");
    const sessionEl = document.getElementById("sessionIdText");
    const sendBtn = document.getElementById("sendBtn");
    const selectedModelTextEl = document.getElementById("selectedModelText");
    const chatForm = document.getElementById("chatForm");
    const minimizeBtn = document.getElementById("minimizeBtn");
    const companyLogo = document.getElementById("companyLogo");
    const logoFallback = document.getElementById("logoFallback");

    companyLogo.addEventListener("load", () => {
      logoFallback.style.display = "none";
    });

    companyLogo.addEventListener("error", () => {
      companyLogo.style.display = "none";
      logoFallback.style.display = "inline";
    });

    function makeSessionId() {
      if (window.crypto && crypto.randomUUID) {
        return "sess-" + crypto.randomUUID();
      }
      return "sess-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    }

    function getSessionId() {
      let sessionId = localStorage.getItem(SESSION_KEY);
      if (!sessionId) {
        sessionId = makeSessionId();
        localStorage.setItem(SESSION_KEY, sessionId);
      }
      return sessionId;
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function setError(text) {
      errorEl.textContent = text || "";
    }

    function updateSelectedModelText() {
      selectedModelTextEl.textContent = modelSelectEl.value;
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function saveHistory() {
      localStorage.setItem(HISTORY_KEY, messagesEl.innerHTML);
    }

    function clearLocalSessionState() {
      localStorage.removeItem(HISTORY_KEY);
      localStorage.removeItem(SESSION_KEY);
    }

    function clearServerSession(sessionId) {
      if (!sessionId) {
        return Promise.resolve();
      }
      const payload = JSON.stringify({ session_id: sessionId });
      return fetch("/procurement/session/clear", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: payload,
        keepalive: true
      }).catch(() => {});
    }

    function sendSessionClear() {
      const sessionId = localStorage.getItem(SESSION_KEY);
      const payload = JSON.stringify({ session_id: sessionId });
      if (sessionId && navigator.sendBeacon) {
        const blob = new Blob([payload], { type: "application/json" });
        navigator.sendBeacon("/procurement/session/clear", blob);
      } else if (sessionId) {
        clearServerSession(sessionId);
      }
      clearLocalSessionState();
    }

    function addBubble(kind, text) {
      const bubble = document.createElement("div");
      bubble.className = "bubble " + kind;
      bubble.textContent = text;
      messagesEl.appendChild(bubble);
      scrollToBottom();
      saveHistory();
      return bubble;
    }

    function loadHistory() {
      const saved = localStorage.getItem(HISTORY_KEY);
      if (saved) {
        messagesEl.innerHTML = saved;
        scrollToBottom();
        return;
      }
      addBubble("meta", "Hi, I am Sam Copilot. Ask about HR, IT helpdesk, SAP, Ariba, approvals, or procurement workflows.");
    }

    function resetChatWindow(message) {
      messagesEl.innerHTML = "";
      localStorage.removeItem(HISTORY_KEY);
      addBubble("meta", message || "New chat started. Ask Sam Copilot a question.");
      messageEl.value = "";
      setError("");
      setStatus("Ready");
      messageEl.focus();
    }

    async function startNewSession() {
      const oldSessionId = localStorage.getItem(SESSION_KEY);
      const newSessionId = makeSessionId();
      localStorage.setItem(SESSION_KEY, newSessionId);
      sessionEl.textContent = newSessionId;
      resetChatWindow("New chat started. Ask Sam Copilot a question.");
      await clearServerSession(oldSessionId);
    }

    function formatAssistantText(answer) {
      try {
        const parsed = JSON.parse(answer);
        const lines = [
          "Summary: " + (parsed.Summary || ""),
          "Key risks: " + (Array.isArray(parsed.KeyRisks) ? parsed.KeyRisks.join("; ") : (parsed.KeyRisks || "")),
          "Recommended next step: " + (parsed.RecommendedNextStep || ""),
          "Confidence: " + (parsed.ConfidenceLevel || ""),
          "Policy references: " + (Array.isArray(parsed.PolicyReferences) ? parsed.PolicyReferences.join(", ") : (parsed.PolicyReferences || ""))
        ];
        if (parsed.SourceUrls && Array.isArray(parsed.SourceUrls) && parsed.SourceUrls.length) {
          lines.push("Sources: " + parsed.SourceUrls.join(", "));
        }
        if (parsed.Codes && Array.isArray(parsed.Codes) && parsed.Codes.length) {
          lines.push("Shortcuts: " + parsed.Codes.map((item) => item.code ? `${item.code}: ${item.summary || ""}` : String(item)).join(" | "));
        }
        if (parsed.MatchedSource) {
          lines.push("Matched source: " + parsed.MatchedSource);
        }
        return lines.join("\n");
      } catch (error) {
        return answer;
      }
    }

    async function sendMessage() {
      const text = messageEl.value.trim();
      if (!text) {
        return;
      }
      setError("");
      setStatus("Sending...");
      sendBtn.disabled = true;

      const sessionId = getSessionId();
      addBubble("user", text);
      messageEl.value = "";

      try {
        const response = await fetch("/procurement/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            session_id: sessionId,
            role: roleEl.value,
            message: text,
            context: contextEl.value,
            ollama_model: modelSelectEl.value,
            response_style: responseStyleEl.value,
            auto_implement: autoImplementEl.checked
          })
        });
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.error || "Request failed");
        }
        sessionEl.textContent = payload.session_id || sessionId;
        const answerText = formatAssistantText(payload.answer || "");
        addBubble("assistant", answerText || "(empty response)");
        if (payload.relevant_policies && payload.relevant_policies.length) {
          addBubble("meta", "Relevant policies: " + payload.relevant_policies.join(", "));
        }
        if (payload.model) {
          addBubble("meta", "Model used: " + payload.model);
        }
        if (payload.implementation) {
          const implementation = payload.implementation;
          addBubble("meta", "Auto-implement action: " + implementation.action + " | " + JSON.stringify(implementation.result));
        }
        setStatus("Ready");
      } catch (error) {
        setStatus("Error");
        setError(error.message);
        addBubble("assistant", "Error: " + error.message);
      } finally {
        sendBtn.disabled = false;
      }
    }

    document.getElementById("copySessionBtn").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(getSessionId());
        setStatus("Session copied");
        setTimeout(() => setStatus("Ready"), 1200);
      } catch (error) {
        setError("Copy failed: " + error.message);
      }
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      const sessionId = localStorage.getItem(SESSION_KEY);
      resetChatWindow("Chat cleared. Continue in this session or start a new one.");
      clearServerSession(sessionId);
    });

    document.getElementById("newSessionBtn").addEventListener("click", async () => {
      await startNewSession();
    });

    modelSelectEl.addEventListener("change", updateSelectedModelText);

    minimizeBtn.addEventListener("click", () => {
      const minimized = widgetShell.classList.toggle("is-minimized");
      minimizeBtn.textContent = minimized ? "+" : "-";
      minimizeBtn.title = minimized ? "Open chat" : "Minimize chat";
      minimizeBtn.setAttribute("aria-label", minimized ? "Open chat" : "Minimize chat");
    });

    chatForm.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage();
    });

    messageEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
        event.preventDefault();
        sendMessage();
      }
    });

    window.addEventListener("beforeunload", sendSessionClear);
    window.addEventListener("pagehide", sendSessionClear);

    window.addEventListener("error", (event) => {
      setError(event.message || "Unexpected UI error");
    });

    sessionEl.textContent = getSessionId();
    modelSelectEl.value = "__OLLAMA_MODEL__";
    updateSelectedModelText();
    loadHistory();
  </script>
</body>
</html>
